// The standard gRPC health-checking protocol, copied from
// https://github.com/grpc/grpc/blob/master/src/proto/grpc/health/v1/health.proto
// (Apache 2.0). Homebrew's gRPC ships the health SERVER but not this proto, and the
// tests need a health CLIENT. Used by tests only; the worker itself does not
// compile this: it uses gRPC's built-in default health service.
syntax = "proto3";

package grpc.health.v1;

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;  // Used only by the Watch method.
  }
  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}
